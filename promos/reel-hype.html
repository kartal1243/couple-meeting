<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couple Meeting - Hype Reel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #000;
  font-family: 'Inter', sans-serif;
}

.container {
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* PHASE 1: Dark → Purple flash */
.phase1 {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(124,58,237,0.6), #0a0118);
  animation: phase1Flash 8s ease-in-out infinite;
}

@keyframes phase1Flash {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Neon ring */
.neon-ring {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 3px solid rgba(16,185,129,0.6);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: neonPulse 4s ease-in-out infinite;
  box-shadow: 0 0 40px rgba(16,185,129,0.3), inset 0 0 40px rgba(16,185,129,0.1);
}

.neon-ring:nth-child(2) {
  width: 350px;
  height: 350px;
  border-color: rgba(139,92,246,0.4);
  animation-delay: -1s;
  box-shadow: 0 0 40px rgba(139,92,246,0.2), inset 0 0 40px rgba(139,92,246,0.05);
}

.neon-ring:nth-child(3) {
  width: 400px;
  height: 400px;
  border-color: rgba(236,72,153,0.3);
  animation-delay: -2s;
  box-shadow: 0 0 40px rgba(236,72,153,0.15), inset 0 0 40px rgba(236,72,153,0.03);
}

@keyframes neonPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
  50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
}

/* Big number countdown */
.countdown {
  position: relative;
  z-index: 10;
  text-align: center;
  animation: countFade 4s ease-in-out infinite;
}

@keyframes countFade {
  0%, 100% { opacity: 1; }
  45% { opacity: 1; }
  50% { opacity: 0; }
  55% { opacity: 1; }
}

.countdown .number {
  font-size: 280px;
  font-weight: 900;
  background: linear-gradient(180deg, #fff 0%, #10b981 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 60px rgba(16,185,129,0.5));
  line-height: 1;
}

.countdown .label {
  font-size: 36px;
  color: #64748b;
  font-weight: 800;
  letter-spacing: 8px;
  margin-top: -10px;
}

/* Main logo reveal */
.main-reveal {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  animation: revealIn 4s ease-in-out 4s both;
}

@keyframes revealIn {
  0% { opacity: 0; transform: scale(0.5); }
  30% { opacity: 1; transform: scale(1.1); }
  100% { opacity: 1; transform: scale(1); }
}

.main-logo {
  width: 180px;
  height: 180px;
  border-radius: 46px;
  background: linear-gradient(135deg, #10b981, #8b5cf6, #ec4899);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 68px;
  font-weight: 900;
  color: #fff;
  box-shadow:
    0 0 80px rgba(16,185,129,0.5),
    0 0 160px rgba(139,92,246,0.3),
    0 30px 80px rgba(0,0,0,0.5);
  animation: logoSpin 6s ease-in-out infinite;
}

@keyframes logoSpin {
  0%, 100% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(3deg) scale(1.02); }
  75% { transform: rotate(-3deg) scale(1.02); }
}

.main-title {
  margin-top: 40px;
  text-align: center;
  animation: slideUp 1s ease-out 4.5s both;
}

@keyframes slideUp {
  0% { opacity: 0; transform: translateY(40px); }
  100% { opacity: 1; transform: translateY(0); }
}

.main-title h1 {
  font-size: 80px;
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -3px;
  color: #fff;
}

.main-title h1 span {
  background: linear-gradient(135deg, #10b981, #34d399);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.main-subtitle {
  margin-top: 24px;
  font-size: 30px;
  color: #94a3b8;
  font-weight: 600;
  text-align: center;
  animation: slideUp 1s ease-out 5s both;
}

.main-url {
  margin-top: 60px;
  font-size: 24px;
  color: #475569;
  font-weight: 800;
  letter-spacing: 4px;
  animation: slideUp 1s ease-out 5.5s both;
}

/* Scan line effect */
.scanline {
  position: absolute;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
}

/* Vignette */
.vignette {
  position: absolute;
  inset: 0;
  z-index: 25;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
}
</style>
</head>
<body>
<div class="container">
  <div class="phase1"></div>

  <div class="neon-ring"></div>
  <div class="neon-ring"></div>
  <div class="neon-ring"></div>

  <div class="countdown">
    <div class="number">3</div>
    <div class="label">HAZIR OLUN</div>
  </div>

  <div class="main-reveal">
    <div class="main-logo">CM</div>
    <div class="main-title">
      <h1>BİRLİKTE<br><span>İZLE & DİNLE</span></h1>
    </div>
    <div class="main-subtitle">Müzik, video ve sohbet bir arada.</div>
    <div class="main-url">COUPLEMEETING.COM.TR</div>
  </div>

  <div class="vignette"></div>
  <div class="scanline"></div>
</div>
</body>
</html>
