name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: cd frontend && npm install
      
      - name: Build frontend
        run: cd frontend && npm run build
      
      - name: Sync Capacitor
        run: cd frontend && npx cap sync android
      
      - name: Build Android AAB
        run: cd frontend/android && chmod +x gradlew && ./gradlew bundleRelease
      
      - name: Build Android APK
        run: cd frontend/android && ./gradlew assembleRelease
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: couple-meeting-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: couple-meeting-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
