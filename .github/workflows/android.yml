name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android
      
      - name: Build Android AAB
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew bundleRelease
      
      - name: Build Android APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease
      
      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: couple-meeting-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
      
      - name: Upload APK (Test)
        uses: actions/upload-artifact@v4
        with:
          name: couple-meeting-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
