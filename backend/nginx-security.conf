# Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com https://f.vimeocdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: ws:; frame-src https://www.youtube.com https://player.vimeo.com;" always;

# Rate Limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# Hide server version
server_tokens off;

# Full config block:
server {
    listen 80;
    server_name couplemeeting.comtr;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name couplemeeting.comtr;

    # SSL (Cloudflare handles this, but good to have)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    limit_conn conn 50;

    # Frontend
    root /var/www/couplemeeting;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Uploads - serve with nosniff
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        add_header X-Content-Type-Options "nosniff";
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    # SEO: Proper content types
    location ~* \.(json|xml)$ {
        add_header Content-Type "application/json";
        add_header Cache-Control "public, max-age=3600";
    }

    # SEO: Sitemap
    location = /sitemap.xml {
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=86400";
    }

    # SEO: Robots
    location = /robots.txt {
        add_header Content-Type "text/plain";
        add_header Cache-Control "public, max-age=86400";
    }

    # SEO: Favicon
    location = /favicon.ico {
        add_header Content-Type "image/svg+xml";
        add_header Cache-Control "public, max-age=604800";
        return 200 '';
    }

    # PWA: Service Worker
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # PWA: Manifest
    location = /manifest.json {
        add_header Content-Type "application/json";
        add_header Cache-Control "public, max-age=86400";
    }

    # Gzip compression for better SEO
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
