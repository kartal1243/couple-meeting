<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Couple Meeting - Twitter Header</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>

<!-- Twitter Header: 1500x500 -->
<div style="width:1500px; height:500px; position:relative; overflow:hidden; font-family:'Arial',sans-serif;">
  <svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0a0e14"/>
        <stop offset="50%" style="stop-color:#1a1033"/>
        <stop offset="100%" style="stop-color:#0a0e14"/>
      </linearGradient>
      <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#a855f7"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
      <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#00d4ff"/>
        <stop offset="100%" style="stop-color:#00b4d8"/>
      </linearGradient>
      <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ff69b4"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <rect width="1500" height="500" fill="url(#bg)"/>
    <circle cx="750" cy="250" r="200" fill="rgba(168,85,247,0.05)"/>

    <!-- Logo -->
    <g transform="translate(750, 200)" filter="url(#glow)">
      <g>
        <path d="M-70,-65 Q-70,-85 -50,-85 L-15,-85 Q5,-85 5,-65 L5,65 Q5,85 -15,85 L-50,85 Q-70,85 -70,65 Z" fill="none" stroke="url(#cyan)" stroke-width="4"/>
        <polygon points="-50,-15 -30,0 -50,15" fill="url(#cyan)" opacity="0.8"/>
      </g>
      <g>
        <path d="M70,-65 Q70,-85 50,-85 L15,-85 Q-5,-85 -5,-65 L-5,65 Q-5,85 15,85 L50,85 Q70,85 70,65 Z" fill="none" stroke="url(#pink)" stroke-width="4"/>
        <polygon points="50,-15 30,0 50,15" fill="url(#pink)" opacity="0.8"/>
      </g>
      <path d="M0,-30 C0,-60 -45,-60 -45,-30 C-45,5 0,45 0,55 C0,45 45,5 45,-30 C45,-60 0,-60 0,-30 Z" fill="none" stroke="url(#purple)" stroke-width="4"/>
    </g>

    <!-- Text -->
    <text x="750" y="310" font-family="Arial, sans-serif" font-size="48" font-weight="300" fill="#fff" text-anchor="middle">Couple </text>
    <text x="870" y="310" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="url(#pink)" text-anchor="middle">Meeting</text>

    <!-- Tagline -->
    <text x="750" y="360" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">ARKADAŞLARINLA CANLI VİDEO ODALARINDA BULUŞ</text>

    <!-- Features -->
    <g transform="translate(750, 420)">
      <rect x="-300" y="-15" width="120" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="-240" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9ca3af" text-anchor="middle">🎬 Video</text>
      
      <rect x="-150" y="-15" width="120" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="-90" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9ca3af" text-anchor="middle">🎵 Müzik</text>
      
      <rect x="0" y="-15" width="120" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="60" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9ca3af" text-anchor="middle">💬 Sohbet</text>
      
      <rect x="150" y="-15" width="120" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="210" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9ca3af" text-anchor="middle">🎤 Sesli</text>
    </g>

    <!-- URL -->
    <text x="750" y="475" font-family="Arial, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">couplemeeting.com.tr</text>
  </svg>
</div>

</body>
</html>
