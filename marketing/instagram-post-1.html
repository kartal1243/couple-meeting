<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Couple Meeting - Instagram Post</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; gap: 20px; }
  .post { width: 1080px; height: 1080px; position: relative; overflow: hidden; font-family: 'Arial', sans-serif; }
</style>
</head>
<body>

<!-- Instagram Post 1: Tanıtım -->
<div class="post">
  <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0a0e14"/>
        <stop offset="50%" style="stop-color:#1a1033"/>
        <stop offset="100%" style="stop-color:#0a0e14"/>
      </linearGradient>
      <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#00d4ff"/>
        <stop offset="100%" style="stop-color:#00b4d8"/>
      </linearGradient>
      <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ff69b4"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
      <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#a855f7"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <!-- Background -->
    <rect width="1080" height="1080" fill="url(#bg)"/>
    <circle cx="540" cy="400" r="300" fill="rgba(168,85,247,0.06)"/>

    <!-- Logo -->
    <g transform="translate(540, 320)" filter="url(#glow)">
      <g>
        <path d="M-90,-80 Q-90,-105 -65,-105 L-20,-105 Q5,-105 5,-80 L5,80 Q5,105 -20,105 L-65,105 Q-90,105 -90,80 Z" fill="none" stroke="url(#cyan)" stroke-width="5"/>
        <polygon points="-65,-20 -40,0 -65,20" fill="url(#cyan)" opacity="0.8"/>
        <path d="M-105,-55 Q-120,-70 -105,-85" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
        <path d="M-120,-42 Q-140,-62 -120,-82" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
      </g>
      <g>
        <path d="M90,-80 Q90,-105 65,-105 L20,-105 Q-5,-105 -5,-80 L-5,80 Q-5,105 20,105 L65,105 Q90,105 90,80 Z" fill="none" stroke="url(#pink)" stroke-width="5"/>
        <polygon points="65,-20 40,0 65,20" fill="url(#pink)" opacity="0.8"/>
        <path d="M105,-55 Q120,-70 105,-85" fill="none" stroke="url(#pink)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
        <path d="M120,-42 Q140,-62 120,-82" fill="none" stroke="url(#pink)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
      </g>
      <path d="M0,-35 C0,-75 -55,-75 -55,-35 C-55,10 0,65 0,80 C0,65 55,10 55,-35 C55,-75 0,-75 0,-35 Z" fill="none" stroke="url(#purple)" stroke-width="5"/>
    </g>

    <!-- Text -->
    <text x="540" y="500" font-family="Arial, sans-serif" font-size="64" font-weight="300" fill="#fff" text-anchor="middle">Couple </text>
    <text x="680" y="500" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="url(#pink)" text-anchor="middle">Meeting</text>

    <!-- Tagline -->
    <text x="540" y="570" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle" letter-spacing="3">ARKADAŞLARINLA CANLI BULUŞ</text>

    <!-- Features -->
    <g transform="translate(540, 650)">
      <rect x="-280" y="-22" width="160" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="-200" y="7" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9ca3af" text-anchor="middle">🎬 Video</text>
      
      <rect x="-90" y="-22" width="160" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="-10" y="7" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9ca3af" text-anchor="middle">🎵 Müzik</text>
      
      <rect x="100" y="-22" width="160" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="180" y="7" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9ca3af" text-anchor="middle">💬 Sohbet</text>
    </g>

    <!-- CTA -->
    <rect x="390" y="730" width="300" height="56" rx="28" fill="url(#purple)"/>
    <text x="540" y="765" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">🚀 ÜCRETSİZ BAŞLA</text>

    <!-- URL -->
    <text x="540" y="830" font-family="Arial, sans-serif" font-size="16" fill="#4b5563" text-anchor="middle">couplemeeting.com.tr</text>

    <!-- BETA Badge -->
    <rect x="505" y="870" width="70" height="26" rx="13" fill="url(#purple)"/>
    <text x="540" y="888" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">BETA</text>
  </svg>
</div>

</body>
</html>
