<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Couple Meeting - Instagram Story</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>

<!-- Instagram Story: 1080x1920 -->
<div style="width:1080px; height:1920px; position:relative; overflow:hidden; font-family:'Arial',sans-serif;">
  <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0a0e14"/>
        <stop offset="50%" style="stop-color:#1a1033"/>
        <stop offset="100%" style="stop-color:#0a0e14"/>
      </linearGradient>
      <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#a855f7"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
      <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#00d4ff"/>
        <stop offset="100%" style="stop-color:#00b4d8"/>
      </linearGradient>
      <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ff69b4"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <rect width="1080" height="1920" fill="url(#bg)"/>
    <circle cx="540" cy="500" r="400" fill="rgba(168,85,247,0.05)"/>

    <!-- Top Badge -->
    <rect x="410" y="120" width="260" height="40" rx="20" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="540" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#a855f7" text-anchor="middle">✨ ÜCRETSİZ PLATFORM</text>

    <!-- Logo -->
    <g transform="translate(540, 400)" filter="url(#glow)">
      <g>
        <path d="M-100,-90 Q-100,-118 -72,-118 L-22,-118 Q6,-118 6,-90 L6,90 Q6,118 -22,118 L-72,118 Q-100,118 -100,90 Z" fill="none" stroke="url(#cyan)" stroke-width="5"/>
        <polygon points="-72,-22 -44,0 -72,22" fill="url(#cyan)" opacity="0.8"/>
      </g>
      <g>
        <path d="M100,-90 Q100,-118 72,-118 L22,-118 Q-6,-118 -6,-90 L-6,90 Q-6,118 22,118 L72,118 Q100,118 100,90 Z" fill="none" stroke="url(#pink)" stroke-width="5"/>
        <polygon points="72,-22 44,0 72,22" fill="url(#pink)" opacity="0.8"/>
      </g>
      <path d="M0,-40 C0,-82 -62,-82 -62,-40 C-62,12 0,74 0,90 C0,74 62,12 62,-40 C62,-82 0,-82 0,-40 Z" fill="none" stroke="url(#purple)" stroke-width="5"/>
    </g>

    <!-- Title -->
    <text x="540" y="580" font-family="Arial, sans-serif" font-size="72" font-weight="300" fill="#fff" text-anchor="middle">Couple </text>
    <text x="730" y="580" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="url(#pink)" text-anchor="middle">Meeting</text>

    <!-- Subtitle -->
    <text x="540" y="650" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="4">ARKADAŞLARINLA CANLI BULUŞ</text>

    <!-- Phone Mockups -->
    <g transform="translate(540, 900)">
      <!-- Left Phone -->
      <g transform="translate(-180, 0)">
        <rect x="-80" y="-140" width="160" height="280" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(0,212,255,0.3)" stroke-width="2"/>
        <rect x="-65" y="-120" width="130" height="200" rx="8" fill="rgba(0,0,0,0.3)"/>
        <text x="0" y="-40" font-family="Arial, sans-serif" font-size="11" fill="#00d4ff" text-anchor="middle">🎵 Müzik Çalıyor</text>
        <rect x="-50" y="-20" width="100" height="6" rx="3" fill="rgba(0,212,255,0.3)"/>
        <rect x="-50" y="0" width="70" height="6" rx="3" fill="rgba(0,212,255,0.2)"/>
        <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">📱 iPhone</text>
      </g>

      <!-- Right Phone -->
      <g transform="translate(180, 0)">
        <rect x="-80" y="-140" width="160" height="280" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(236,72,153,0.3)" stroke-width="2"/>
        <rect x="-65" y="-120" width="130" height="200" rx="8" fill="rgba(0,0,0,0.3)"/>
        <text x="0" y="-40" font-family="Arial, sans-serif" font-size="11" fill="#ec4899" text-anchor="middle">💬 Sohbet</text>
        <rect x="-50" y="-20" width="100" height="6" rx="3" fill="rgba(236,72,153,0.3)"/>
        <rect x="-50" y="0" width="70" height="6" rx="3" fill="rgba(236,72,153,0.2)"/>
        <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">📱 Android</text>
      </g>

      <!-- Heart Connection -->
      <path d="M-80,0 C-40,-60 40,-60 80,0 C40,40 0,60 0,80 C0,60 -40,40 -80,0 Z" fill="none" stroke="url(#purple)" stroke-width="3" opacity="0.5"/>
    </g>

    <!-- Features -->
    <g transform="translate(540, 1150)">
      {['🎬 YouTube İzle', '🎵 Müzik Paylaş', '💬 Canlı Sohbet', '🎤 Sesli Chat', '📺 Ekran Paylaş', '🔒 Özel Odalar'].map((f, i) => {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const x = col === 0 ? -180 : 20;
        const y = row * 60;
        return `
          <rect x="${x}" y="${y}" width="160" height="44" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <text x="${x + 80}" y="${y + 27}" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">${f}</text>
        `;
      }).join('')}
    </g>

    <!-- CTA -->
    <rect x="340" y="1400" width="400" height="64" rx="32" fill="url(#purple)"/>
    <text x="540" y="1440" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">🚀 HEMEN BAŞLA</text>

    <!-- Swipe Up -->
    <text x="540" y="1520" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Yukarı kaydır ↗</text>

    <!-- URL -->
    <text x="540" y="1580" font-family="Arial, sans-serif" font-size="16" fill="#4b5563" text-anchor="middle">couplemeeting.com.tr</text>
  </svg>
</div>

</body>
</html>
