<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Couple Meeting - Facebook Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>

<!-- Facebook Cover: 820x312 -->
<div style="width:820px; height:312px; position:relative; overflow:hidden; font-family:'Arial',sans-serif;">
  <svg xmlns="http://www.w3.org/2000/svg" width="820" height="312" viewBox="0 0 820 312">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0a0e14"/>
        <stop offset="50%" style="stop-color:#1a1033"/>
        <stop offset="100%" style="stop-color:#0a0e14"/>
      </linearGradient>
      <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#a855f7"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
      <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#00d4ff"/>
        <stop offset="100%" style="stop-color:#00b4d8"/>
      </linearGradient>
      <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ff69b4"/>
        <stop offset="100%" style="stop-color:#ec4899"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <rect width="820" height="312" fill="url(#bg)"/>
    <circle cx="410" cy="156" r="120" fill="rgba(168,85,247,0.05)"/>

    <!-- Logo -->
    <g transform="translate(410, 130)" filter="url(#glow)">
      <g>
        <path d="M-55,-50 Q-55,-68 -40,-68 L-12,-68 Q4,-68 4,-50 L4,50 Q4,68 -12,68 L-40,68 Q-55,68 -55,50 Z" fill="none" stroke="url(#cyan)" stroke-width="3"/>
        <polygon points="-40,-12 -24,0 -40,12" fill="url(#cyan)" opacity="0.8"/>
      </g>
      <g>
        <path d="M55,-50 Q55,-68 40,-68 L12,-68 Q-4,-68 -4,-50 L-4,50 Q-4,68 12,68 L40,68 Q55,68 55,50 Z" fill="none" stroke="url(#pink)" stroke-width="3"/>
        <polygon points="40,-12 24,0 40,12" fill="url(#pink)" opacity="0.8"/>
      </g>
      <path d="M0,-25 C0,-50 -38,-50 -38,-25 C-38,5 0,38 0,48 C0,38 38,5 38,-25 C38,-50 0,-50 0,-25 Z" fill="none" stroke="url(#purple)" stroke-width="3"/>
    </g>

    <!-- Text -->
    <text x="410" y="210" font-family="Arial, sans-serif" font-size="36" font-weight="300" fill="#fff" text-anchor="middle">Couple </text>
    <text x="500" y="210" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="url(#pink)" text-anchor="middle">Meeting</text>

    <!-- Tagline -->
    <text x="410" y="250" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="2">ARKADAŞLARINLA CANLI BULUŞ</text>

    <!-- CTA -->
    <rect x="335" y="270" width="150" height="32" rx="16" fill="url(#purple)"/>
    <text x="410" y="291" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">🚀 ÜCRETSİZ BAŞLA</text>
  </svg>
</div>

</body>
</html>
