<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff69b4"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <g transform="translate(50, 48)">
    <!-- Left phone -->
    <path d="M-22,-20 Q-22,-28 -14,-28 L-4,-28 Q4,-28 4,-20 L4,20 Q4,28 -4,28 L-14,28 Q-22,28 -22,20 Z" 
          fill="none" stroke="url(#cyan)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="-14,-6 -8,0 -14,6" fill="url(#cyan)" opacity="0.8"/>
    <!-- Right phone -->
    <path d="M22,-20 Q22,-28 14,-28 L4,-28 Q-4,-28 -4,-20 L-4,20 Q-4,28 4,28 L14,28 Q22,28 22,20 Z" 
          fill="none" stroke="url(#pink)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="14,-6 8,0 14,6" fill="url(#pink)" opacity="0.8"/>
    <!-- Heart -->
    <path d="M0,-8 C0,-18 -14,-18 -14,-8 C-14,2 0,14 0,18 C0,14 14,2 14,-8 C14,-18 0,-18 0,-8 Z" 
          fill="none" stroke="url(#purple)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
