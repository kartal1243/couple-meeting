<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff69b4"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Center glow -->
  <circle cx="256" cy="230" r="120" fill="rgba(168,85,247,0.1)"/>
  
  <g transform="translate(256, 220)" filter="url(#glow)">
    <!-- Left phone (cyan) -->
    <path d="M-80,-70 Q-80,-95 -55,-95 L-15,-95 Q10,-95 10,-70 L10,70 Q10,95 -15,95 L-55,95 Q-80,95 -80,70 Z" 
          fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="-55,-15 -35,0 -55,15" fill="url(#cyan)" opacity="0.8"/>
    <!-- WiFi -->
    <path d="M-95,-50 Q-110,-65 -95,-80" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M-108,-38 Q-128,-58 -108,-78" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Right phone (pink) -->
    <path d="M80,-70 Q80,-95 55,-95 L15,-95 Q-10,-95 -10,-70 L-10,70 Q-10,95 15,95 L55,95 Q80,95 80,70 Z" 
          fill="none" stroke="url(#pink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="55,-15 35,0 55,15" fill="url(#pink)" opacity="0.8"/>
    <!-- WiFi -->
    <path d="M95,-50 Q110,-65 95,-80" fill="none" stroke="url(#pink)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M108,-38 Q128,-58 108,-78" fill="none" stroke="url(#pink)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Heart -->
    <path d="M0,-30 C0,-65 -50,-65 -50,-30 C-50,10 0,55 0,70 C0,55 50,10 50,-30 C50,-65 0,-65 0,-30 Z" 
          fill="none" stroke="url(#purple)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Couple Meeting text -->
  <text x="256" y="380" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="300" fill="#ffffff" text-anchor="middle">Couple </text>
  <text x="355" y="380" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="url(#pink)" text-anchor="middle">Meeting</text>
</svg>
