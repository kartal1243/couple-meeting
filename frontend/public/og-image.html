<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; background: linear-gradient(135deg, #0a0e14 0%, #111b21 50%, #0f1a24 100%); font-family: 'Arial', sans-serif; overflow: hidden; position: relative; }
.glow { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(124,58,237,.2), transparent 70%); top: -100px; right: -50px; }
.glow2 { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(236,72,153,.15), transparent 70%); bottom: -80px; left: -30px; }
.content { position: relative; z-index: 2; display: flex; height: 100%; align-items: center; padding: 60px 80px; }
.left { flex: 1; }
.logo-box { width: 80px; height: 80px; border-radius: 22px; background: linear-gradient(135deg, #7c3aed, #ec4899); display: flex; align-items: center; justify-content: center; margin-bottom: 30px; box-shadow: 0 12px 40px rgba(124,58,237,.4); }
.logo-text { color: white; font-size: 36px; font-weight: 900; }
.title { color: #fff; font-size: 52px; font-weight: 900; line-height: 1.1; margin-bottom: 16px; letter-spacing: -1px; }
.title span { background: linear-gradient(135deg, #7c3aed, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.desc { color: #94a3b8; font-size: 22px; line-height: 1.5; font-weight: 500; }
.features { display: flex; gap: 20px; margin-top: 30px; }
.feature { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 12px 20px; color: #e2e8f0; font-size: 16px; font-weight: 700; }
.right { width: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.phone { width: 220px; height: 440px; border-radius: 32px; background: linear-gradient(180deg, #1a2634, #111b21); border: 3px solid #2a3942; position: relative; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.phone-screen { position: absolute; inset: 8px; border-radius: 26px; background: linear-gradient(180deg, #0f1a24, #0a0e14); overflow: hidden; }
.phone-header { padding: 16px 12px 8px; text-align: center; color: #7c3aed; font-size: 10px; font-weight: 900; letter-spacing: 1; }
.phone-player { padding: 12px; text-align: center; }
.phone-album { width: 60px; height: 60px; border-radius: 12px; background: linear-gradient(135deg, #7c3aed, #ec4899); margin: 0 auto 8px; }
.phone-song { color: #fff; font-size: 11px; font-weight: 800; }
.phone-artist { color: #64748b; font-size: 9px; margin-top: 2px; }
.phone-chat { padding: 8px 10px; }
.phone-msg { padding: 6px 10px; border-radius: 10px; margin-bottom: 4px; font-size: 9px; max-width: 80%; }
.msg-them { background: rgba(255,255,255,.08); color: #e2e8f0; }
.msg-me { background: rgba(124,58,237,.2); color: #a855f7; margin-left: auto; }
.url { position: absolute; bottom: 30px; right: 80px; color: #475569; font-size: 18px; font-weight: 700; z-index: 3; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="glow2"></div>
<div class="content">
  <div class="left">
    <div class="logo-box"><span class="logo-text">♥</span></div>
    <div class="title"><span>Couple Meeting</span></div>
    <div class="desc">Arkadaşlarınla aynı anda<br/>YouTube videosu izle, müzik paylaş,<br/>sesli ve yazılı sohbet et.</div>
    <div class="features">
      <div class="feature">🎬 Video Odası</div>
      <div class="feature">🎵 Müzik</div>
      <div class="feature">💬 Sohbet</div>
    </div>
  </div>
  <div class="right">
    <div class="phone">
      <div class="phone-screen">
        <div class="phone-header">COUPLE MEETING</div>
        <div class="phone-player">
          <div class="phone-album"></div>
          <div class="phone-song">Seni Dert Etmek</div>
          <div class="phone-artist">Sezen Aksu</div>
        </div>
        <div class="phone-chat">
          <div class="phone-msg msg-them">Başlattım gelsene ❤️</div>
          <div class="phone-msg msg-me">Geliyorum!</div>
          <div class="phone-msg msg-them">Bu şarkı harika 🔥</div>
          <div class="phone-msg msg-me">Biliyorum!</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="url">couplemeeting.com.tr</div>
</body>
</html>
