<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- Mobil cihazlarda düzgün ölçeklenme için hayati önem taşır -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Uyumlu Sayfa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #f4f4f9;
            padding: 16px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Mobil Uyumlu Buton Grubu */
        .button-group {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        /* Ekrana tam oturan esnek butonlar */
        .btn {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
        }

        .btn-primary {
            background-color: #007bff;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: #ffffff;
        }

        /* Masaüstünde butonları yan yana getirmek için */
        @media (min-width: 600px) {
            .button-group {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Hoş Geldiniz</h1>
        <p>Mobil uyumlu yapıyla düzeltilmiş içerik alanı.</p>
        
        <div class="button-group">
            <button class="btn btn-primary" onclick="alert('İşlem tamamlandı')">Devam Et</button>
            <!-- Sayfadan güvenli çıkış veya yönlendirme butonu -->
            <a href="https://google.com" class="btn btn-secondary">Çıkış Yap</a>
        </div>
    </div>

    <script>
        // Sayfa geçmişini (history) manipüle ederek kullanıcının geriye basıp sitede kalmasını engeller
        // Ekstra tuzak pushState kodları varsa bunları silmeniz gerekir.
        window.addEventListener('popstate', function (event) {
            // Eğer özel bir popstate engeli koymadıysanız tarayıcı normal davranacaktır.
        });
    </script>
</body>
</html>
